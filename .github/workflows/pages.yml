name: Deploy to GitHub Pages

# Preview hosting for the team. Production is a separate concern — the site is
# written to live at the root of newst.com, and this workflow adapts the built
# output to a subdirectory rather than changing the source. See
# newstreet-v4/scripts/rebase-for-pages.mjs.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# QUEUE, DO NOT CANCEL. This was `cancel-in-progress: true`, which cancels the
# workflow RUN but cannot recall the Pages DEPLOYMENT that run has already
# created. The deployment stays open on GitHub's side, and the next run's deploy
# step is then rejected outright:
#
#   Deployment request failed … due to in progress deployment.
#   Please cancel <sha> first or wait for it to complete.
#
# It also explains a partial rollout seen earlier, where the site served its
# homepage but 404'd every subpage: a deployment cancelled midway had published
# the root and never finished the rest.
#
# Pages deployments are not interruptible, so pushes queue behind each other.
# One extra build is cheaper than a broken deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: newstreet-v4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: newstreet-v4/package-lock.json

      - run: npm ci

      # NOT `npm run build` — that regenerates data and images from the V3
      # archive, which is deliberately not in this repo. The committed
      # derivatives and extracted data are what this builds from.
      - run: npx astro build

      # Pages serves this repo at /<repo>/, so every root-absolute path in the
      # output is rewritten to sit under it.
      - run: node scripts/rebase-for-pages.mjs "/${GITHUB_REPOSITORY#*/}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: newstreet-v4/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
